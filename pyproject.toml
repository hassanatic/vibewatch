[project]
name = "vibewatch"
version = "0.1.0"
description = "Vibration condition monitoring: velocity RMS from acceleration, ISO 10816-3 zones, per-asset trends"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vibewatch = "vibewatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vibewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
